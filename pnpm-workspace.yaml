# Dependencies allowed to run their install scripts (pnpm fails on the ones not listed)
allowBuilds:
  # Downloads the Chrome it drives
  puppeteer: true

# My own packages (smndhm/dev-config) can be used as soon as they are published
minimumReleaseAgeExclude:
  - '@dume/*'

# Exact versions when adding a dependency: a caret would let in a release nobody tested
savePrefix: ''
