name: Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: smndhm/dev-config/ci/setup@19119a179a8e532ef1f8d5d386d146b6a54a7535 # main
      # Ubuntu keeps unprivileged programs from creating the namespaces Chrome
      # sandboxes itself in. Lifting that beats running it without a sandbox.
      - name: Let Chrome sandbox itself
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: Lint
        run: pnpm run lint
      - name: Run tests
        run: pnpm run test
