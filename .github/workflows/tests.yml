name: Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Ubuntu keeps unprivileged programs from creating the namespaces Chrome
      # sandboxes itself in. Lifting that beats running it without a sandbox.
      - name: Let Chrome sandbox itself
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
      - name: Install modules
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Run tests
        run: pnpm run test
