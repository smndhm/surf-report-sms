name: Cron surf-report

on:
  # In UTC: 7:37, 10:37, 12:37, 17:37 and 22:37 in Paris in summer, an hour
  # earlier in winter. In the second half of the hour, where GitHub's scheduler
  # is the least loaded. See the README.
  schedule:
    - cron: '37 5,8,10,15,20 * * *'
  workflow_dispatch:

concurrency:
  group: surf-report
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/crons.yml
    with:
      cron: surf-report
      # One SMS per spot with a good enough session. A spot is one more line.
      arguments: |
        {
          "spots": [
            "https://www.surf-report.com/meteo-surf/kerhilio-s1168.html"
          ],
          "minStars": 2
        }
    secrets: inherit
