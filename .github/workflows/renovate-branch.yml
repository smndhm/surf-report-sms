name: Renovate branch

on:
  push:
    branches:
      - 'renovate/**'

jobs:
  # Copies @dume/dev-config's files, then runs the CI checks on that commit (see smndhm/dev-config)
  renovate-branch:
    uses: smndhm/dev-config/.github/workflows/renovate-branch.yml@5d92c9d51b8ed2a7c96b276110e5d7ec4b5aa276 # main
    permissions:
      contents: write
      statuses: write
    with:
      checks: |
        # Lets Chrome sandbox itself, as in the Tests workflow
        echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
        pnpm run lint
        pnpm run test
