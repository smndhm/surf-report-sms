# Steps shared by every cron, never run on its own
name: Surf report

on:
  workflow_call:
    inputs:
      cron:
        description: 'Name of the cron, as it appears in the logs'
        required: true
        type: string
      arguments:
        description: 'Spots to read and minimum of stars, as JSON. Credentials are secrets, never written.'
        required: true
        type: string

jobs:
  run-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Ubuntu keeps unprivileged programs from creating the namespaces Chrome
      # sandboxes itself in. Lifting that beats running it without a sandbox.
      - name: Let Chrome sandbox itself
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Install modules
        run: pnpm install --frozen-lockfile

      # The credentials stay out of the install step, which runs third party code
      - name: Run cron
        run: pnpm run cron:once
        env:
          FREE_MOBILE_USER: ${{ secrets.FREE_MOBILE_USER }}
          FREE_MOBILE_PASS: ${{ secrets.FREE_MOBILE_PASS }}
          CRON_NAME: ${{ inputs.cron }}
          CRON_ARGUMENTS: ${{ inputs.arguments }}
