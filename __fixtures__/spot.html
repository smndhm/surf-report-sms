<!DOCTYPE html>
<!-- The shape of a surf-report.com spot page, as far as the scraper reads it -->
<html>
<head><meta charset="utf-8"><title>Kerhilio</title></head>
<body>
  <div class="forecast-tab">
    <div class="title"> Samedi 11 </div>
    <div class="content">
      <div class="line">Header</div>
      <div class="line">
        <div class="cell date"> 09h </div>
        <div class="cell stars"><i class="fa-star"></i><i class="fa-star"></i><i class="fa-star"></i></div>
        <div class="cell waves"> 1.2m </div>
        <div class="cell"><span class="swell">1.5m</span><span class="swell">12s</span><span class="swell"><img alt=" O "></span></div>
        <div class="cell"><span class="swell secondary">0.5m</span><span class="swell secondary">8s</span><span class="swell secondary"></span></div>
        <div class="cell"><span class="wind">10</span><span class="wind"><img alt="E"></span></div>
        <div class="cell"><span class="weather"><img alt="Soleil"></span></div>
        <div class="cell"><span class="micro temp">15°</span></div>
      </div>
      <div class="line">
        <div class="cell date">12h</div>
        <div class="cell stars"><i class="fa-star"></i></div>
        <div class="cell waves">0.8m</div>
        <div class="cell"><span class="swell">1m</span><span class="swell">9s</span><span class="swell"></span></div>
        <div class="cell"><span class="swell secondary">0.3m</span><span class="swell secondary">6s</span><span class="swell secondary"></span></div>
        <div class="cell"><span class="wind">25</span><span class="wind"></span></div>
        <div class="cell"><span class="weather"><img alt="Pluie"></span></div>
        <div class="cell"><span class="micro temp">13°</span></div>
      </div>
      <div class="line tides">Tides</div>
    </div>
  </div>
  <div class="forecast-tab">
    <div class="title">Dimanche 12</div>
    <div class="content">
      <div class="line">Header</div>
      <div class="line">
        <div class="cell date">09h</div>
        <div class="cell stars"></div>
        <div class="cell waves">0.2m</div>
        <div class="cell"><span class="swell">0.4m</span><span class="swell">5s</span><span class="swell"></span></div>
        <div class="cell"><span class="swell secondary">0.1m</span><span class="swell secondary">4s</span><span class="swell secondary"></span></div>
        <div class="cell"><span class="wind">30</span><span class="wind"></span></div>
        <div class="cell"><span class="weather"><img alt="Nuages"></span></div>
        <div class="cell"><span class="micro temp">12°</span></div>
      </div>
    </div>
  </div>
</body>
</html>
